<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071213">
  <title>鹿雨森 | Silvarain · 遊戲入口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">

  <!-- 軍火庫原始 JS/CSS 一律透過 HTTPS 絕對路徑引用，不複製進專案。 -->
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/breathing_glow.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/button_shine.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/line/gradient_divider.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/hover/pointer_parallax.css">
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="./game_style.css">

  <script src="https://lib.stillnessbyslowly.com/effects/background/pine_forest.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/background/fog.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/background/rain.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/hover/pointer_parallax.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/ui/toast.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/state/navigation/navigation.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/context/audio_context.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/source/noise.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/gain.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/envelope.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/filter/biquad_filter.js" defer></script>
  <script src="./game.js" defer></script>
  <script src="./game_style.js" defer></script>
</head>
<body>
  <!-- 每一個軍火庫 Canvas 零件各有自己的圖層，由宿主控制疊放。 -->
  <div id="scene" class="scene sbs-parallax" data-range-x="22" data-range-y="12" aria-hidden="true">
    <canvas id="back" class="sbs-parallax-layer" data-depth="0.45"></canvas>
    <canvas id="fog" class="sbs-parallax-layer" data-depth="0.9"></canvas>
    <canvas id="front" class="sbs-parallax-layer" data-depth="1.15"></canvas>
    <canvas id="rain" class="sbs-parallax-layer" data-depth="0.7"></canvas>
    <canvas id="particles" class="sbs-parallax-layer" data-depth="1"></canvas>
  </div>
  <div id="flash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="veil" aria-hidden="true"></div>

  <button id="sound" type="button" aria-pressed="false">雨聲 · 關</button>

  <main id="ui">
    <svg id="antler" viewBox="0 0 200 120" aria-hidden="true"></svg>
    <h1 class="sbs-breathe" aria-label="鹿雨森">
      <span style="--i:0">鹿</span><span style="--i:1">雨</span><span style="--i:2">森</span>
    </h1>
    <p class="en fade" style="--d:3s">Silvarain: Silent Antler of Silvarain</p>
    <div class="rule slowly-gradient-divider fade" style="--d:3.3s" aria-hidden="true"></div>
    <p class="tag fade" style="--d:3.6s">在霧未散去的地方，仍保留著某些聲音</p>
    <nav class="menu fade" style="--d:4.4s">
      <button id="start" class="btn primary sbs-shine" type="button">踏入霧中</button>
      <button id="leave" class="btn ghost sbs-shine" type="button">逃離霧中</button>
    </nav>
  </main>

  <p class="hint fade" style="--d:5.5s">建議戴上耳機</p>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
